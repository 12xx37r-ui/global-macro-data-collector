name: Fast Market Refresh V230

on:
  workflow_dispatch:
  schedule:
    # Full engine runs daily at 15:20 UTC.
    # Keep fast refresh out of the full-run neighborhood: skip 14/16 UTC.
    # Staggered provider slot; recent-full guard in fast_market_refresh.py avoids redundant calls.
    - cron: "57 0,2,4,6,8,10,12,18,20,22 * * 1-5"

permissions:
  contents: write

concurrency:
  group: global-macro-engine-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install requests
      - name: Refresh only fast-moving market inputs
        run: python fast_market_refresh.py
      - name: Commit only generated market files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/card12.json public/data/cards_8_12_bundle.json public/data/fast_market_refresh_status.json
          if git diff --cached --quiet; then
            echo "No newer values; skip push."
          else
            git commit -m "chore: fast refresh global market snapshot"
            git push
          fi
